name: engineering-team

services:
  app:
    build:
      context: .
      target: runtime
    image: local/engineering-team:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ENGINEERING_TEAM_PORT:-4318}:4317"
    environment:
      ENGINEERING_TEAM_HOST: 0.0.0.0
      ENGINEERING_TEAM_PORT: 4317
      ENGINEERING_TEAM_DATABASE: /data/engineering-team.db
      ENGINEERING_TEAM_WORKSPACE_ROOT: /workspaces
      ENGINEERING_TEAM_PROJECT_NAME: ${ENGINEERING_TEAM_PROJECT_NAME:-}
      ENGINEERING_TEAM_WEB_ROOT: public
      ENGINEERING_TEAM_CONTROLLER_URL: http://controller:4319
      ENGINEERING_TEAM_CONTROLLER_TOKEN: ${ENGINEERING_TEAM_CONTROLLER_TOKEN:?Set a shared worker-controller token}
      ENGINEERING_TEAM_SPEECH_URL: http://speech:4320
      ENGINEERING_TEAM_TTS_URL: http://tts:4321
      ENGINEERING_TEAM_UID: ${ENGINEERING_TEAM_UID:-1000}
      ENGINEERING_TEAM_GID: ${ENGINEERING_TEAM_GID:-1000}
    volumes:
      - engineering-team-data:/data
      - engineering-team-worktrees:/worktrees
      - ${WORKSPACE_ROOT:-..}:/workspaces:rw
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    depends_on:
      controller:
        condition: service_healthy
    networks:
      - default
      - speech

  speech-models:
    profiles: ["voice"]
    build:
      context: .
      dockerfile: docker/voice.Dockerfile
    image: local/engineering-team-speech:v1
    user: "0:0"
    entrypoint: ["/usr/local/bin/download-speech-model"]
    volumes:
      - engineering-team-speech-models:/models
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  speech:
    profiles: ["voice"]
    image: local/engineering-team-speech:v1
    restart: unless-stopped
    depends_on:
      speech-models:
        condition: service_completed_successfully
    volumes:
      - engineering-team-speech-models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g
    cpus: ${ENGINEERING_TEAM_SPEECH_CPUS:-4}
    networks: [speech]

  tts-models:
    profiles: ["voice"]
    build:
      context: .
      target: tts
    image: local/engineering-team-tts:v1
    user: "0:0"
    entrypoint: ["/usr/local/bin/download-tts-model"]
    volumes:
      - engineering-team-tts-models:/models
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  tts:
    profiles: ["voice"]
    image: local/engineering-team-tts:v1
    restart: unless-stopped
    depends_on:
      tts-models:
        condition: service_completed_successfully
    volumes:
      - engineering-team-tts-models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g
    cpus: ${ENGINEERING_TEAM_TTS_CPUS:-2}
    networks: [speech]

  controller:
    build:
      context: .
      target: controller
    image: local/engineering-team-controller:latest
    restart: unless-stopped
    environment:
      ENGINEERING_TEAM_CONTROLLER_HOST: 0.0.0.0
      ENGINEERING_TEAM_CONTROLLER_PORT: 4319
      ENGINEERING_TEAM_CONTROLLER_TOKEN: ${ENGINEERING_TEAM_CONTROLLER_TOKEN:?Set a shared worker-controller token}
      ENGINEERING_TEAM_WORKSPACE_ROOT: /workspaces
      ENGINEERING_TEAM_MAX_WORKERS: ${ENGINEERING_TEAM_MAX_WORKERS:-2}
      ENGINEERING_TEAM_WORKTREE_ROOT: /worktrees
      ENGINEERING_TEAM_PROVIDER_AUTH_ROOT: /provider-auth
      ENGINEERING_TEAM_WORKER_IMAGE: local/engineering-team-controller:latest
      ENGINEERING_TEAM_CODEX_AUTH_FILE: /run/secrets/codex-auth.json
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      CODEX_ACCESS_TOKEN: ${CODEX_ACCESS_TOKEN:-}
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - engineering-team-worktrees:/worktrees
      - engineering-team-provider-auth:/provider-auth
      - ${WORKSPACE_ROOT:-..}:/workspaces:rw
      - ${CODEX_AUTH_FILE:-/dev/null}:/run/secrets/codex-auth.json:ro
      - ${AWS_CONFIG_DIR:-./docker/empty-aws}:/root/.aws:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    stop_grace_period: 20s

  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    image: local/engineering-team-test:latest
    command: ["sh", "-lc", "npm test && npm run typecheck && npm run build"]

volumes:
  engineering-team-data:
  engineering-team-worktrees:
  engineering-team-provider-auth:
  engineering-team-speech-models:
  engineering-team-tts-models:

networks:
  speech:
    internal: true
